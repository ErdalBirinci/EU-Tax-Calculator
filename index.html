<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EU Tax Calculator — Gross to Net Salary Across Europe</title>
    <meta name="description" content="Calculate gross to net salary in all 27 EU countries with 2025/2026 tax brackets, social security, cost of living and expat regimes. Fast offline engine, 6 languages." />

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'" />
